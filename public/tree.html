<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Tree</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/tree.css">
</head>
<body class="tree-page">

<header class="t-topbar">
  <div class="t-brand">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M2 4.2c0-.7.6-1.3 1.3-1.3h2.6l1.4 1.6h5.4c.7 0 1.3.6 1.3 1.3v6c0 .7-.6 1.3-1.3 1.3H3.3c-.7 0-1.3-.6-1.3-1.3V4.2z"
            stroke="currentColor" stroke-width="1.3" fill="none"/>
    </svg>
    <span>File Tree</span>
  </div>
  <span class="t-repo" id="t-repo"></span>
  <span class="t-commit mono" id="t-commit" title="当前查看的提交"></span>
  <!-- 查看范围：该提交的快照 / 工作区当前内容（含未提交改动） -->
  <div class="t-scope" id="t-scope" role="group" aria-label="查看范围">
    <button class="t-scope-btn" data-scope="commit" title="查看该提交的快照">提交</button>
    <button class="t-scope-btn" data-scope="worktree" title="查看工作区当前内容（含未提交的改动）">工作区</button>
  </div>
  <!-- 该提交上指向它的 tag（发布版本）。没有就不显示 -->
  <span class="t-tags" id="t-tags"></span>
  <span class="t-subject" id="t-subject"></span>
  <div class="spacer"></div>
  <span class="t-stat" id="t-stat"></span>
  <span class="t-wt" id="t-wt" title="在哪个 worktree 中查看"></span>
</header>

<main class="t-layout" id="t-layout">
  <!-- 左：文件树 / 内容搜索（两个视图，各带各的控件） -->
  <section class="t-tree-pane">
    <div class="t-views" role="tablist" aria-label="左侧视图">
      <button class="t-view-tab active" id="t-tab-tree" role="tab" aria-selected="true">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 3.5h3.5M2.5 8h3.5M2.5 12.5h3.5M8.5 3.5h5M8.5 8h5M8.5 12.5h5"
                stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        文件树
      </button>
      <button class="t-view-tab" id="t-tab-search" role="tab" aria-selected="false">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        搜索
      </button>
      <div class="spacer"></div>
      <span class="t-grep-stat" id="t-grep-stat"></span>
    </div>

    <!-- 视图一：文件树 -->
    <div class="t-view" id="t-view-tree">
      <div class="t-tree-head">
        <input class="t-filter" id="t-filter" placeholder="过滤路径…" spellcheck="false">
        <button class="t-icon-btn" id="t-toggle-compact"
                title="合并只有一个子目录的层级（如 com/mysoft/jmpt）" aria-pressed="true">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 3h8M4 13h8M8 5.5v5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="t-icon-btn" id="t-collapse-all" title="全部折叠">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 6 6)"/>
          </svg>
        </button>
      </div>
      <div class="t-tree-wrap" id="t-tree-wrap">
        <div class="t-tree" id="t-tree" role="tree"></div>
        <div class="t-empty" id="t-tree-empty" hidden></div>
      </div>
    </div>

    <!-- 视图二：内容搜索（搜的是这个提交的快照，不是磁盘） -->
    <div class="t-view" id="t-view-search" hidden>
      <div class="t-tree-head">
        <input class="t-filter" id="t-grep-input" placeholder="搜索文件内容…" spellcheck="false">
      </div>
      <div class="t-grep-bar" id="t-grep-bar">
        <label class="t-toggle" title="忽略大小写">
          <input type="checkbox" id="t-grep-icase">
          <span>Aa</span>
        </label>
        <label class="t-toggle" title="按正则表达式匹配（默认按字面量）">
          <input type="checkbox" id="t-grep-regex">
          <span>.*</span>
        </label>
        <label class="t-toggle" title="只搜选中的目录（在文件树里点一个目录后再勾）">
          <input type="checkbox" id="t-grep-scope">
          <span>限当前目录</span>
        </label>
      </div>
      <div class="t-grep-results" id="t-grep-results"></div>
    </div>
  </section>

  <div class="t-splitter" id="t-splitter" role="separator" aria-label="调整树宽度" title="拖动调整宽度，双击复位"></div>

  <!-- 右：文件内容 -->
  <section class="t-file-pane">
    <div class="t-file-head">
      <span class="t-file-path mono" id="t-file-path"></span>
      <div class="spacer"></div>
      <span class="t-file-meta" id="t-file-meta"></span>
      <label class="t-toggle" id="t-hl-wrap" title="语法高亮开关（对大文件自动关闭）">
        <input type="checkbox" id="t-hl" checked>
        <span>高亮</span>
      </label>
      <button class="t-btn" id="t-btn-outline" title="显示 / 隐藏符号大纲">大纲</button>
      <button class="t-btn" id="t-btn-history" title="在新标签页查看该文件的提交历史" hidden>
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 4.8V8l2.2 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        文件历史
      </button>
      <button class="t-btn" id="t-btn-copy-path" title="复制完整路径" hidden>复制路径</button>
    </div>
    <div class="t-file-main">
      <div class="t-file-body" id="t-file-body">
        <div class="t-empty" style="padding:24px 16px">在左侧选择一个文件查看内容。</div>
      </div>

      <!-- 右侧符号大纲：只列类型和函数，树形展示嵌套 -->
      <aside class="t-outline" id="t-outline" hidden>
        <div class="t-outline-head">
          <span class="t-outline-title">Symbols</span>
          <span class="t-outline-count" id="t-outline-count"></span>
          <div class="spacer"></div>
          <button class="t-icon-btn" id="t-outline-close" title="隐藏大纲" aria-label="隐藏大纲">
            <svg width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="t-outline-search">
          <input id="t-outline-filter" placeholder="过滤符号…" spellcheck="false" autocomplete="off">
        </div>
        <div class="t-outline-list" id="t-outline-list" role="tree"></div>

        <!-- 当前符号的引用：独立分区，未选中符号时整段隐藏 -->
        <div class="t-outline-refs" id="t-outline-refs" hidden>
          <div class="t-outline-refs-head">
            <span class="t-refs-label">引用</span>
            <span class="t-refs-sym" id="t-refs-sym"></span>
          </div>
          <div class="t-outline-refs-list" id="t-outline-refs-list"></div>
          <div class="t-outline-refs-foot">
            <button class="o-search-all" id="t-search-all" title="在左侧搜索整个提交快照">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              在所有文件中搜索
            </button>
          </div>
        </div>
      </aside>
    </div>
  </section>
    </div>
  </section>
</main>

<div class="h-toast" id="t-toast" hidden></div>

<script type="module" src="/tree.js"></script>
</body>
</html>
