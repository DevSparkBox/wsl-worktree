<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/tree.css">
<link rel="stylesheet" href="/history.css">
<link rel="stylesheet" href="/compare.css">
</head>
<body class="tree-page">

<header class="t-topbar c-topbar">
  <div class="t-brand">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M4.5 2v9M4.5 11a2 2 0 0 0 2 2h5M11.5 14V5M11.5 5a2 2 0 0 0-2-2h-5"
            stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    </svg>
    <span>Compare</span>
  </div>
  <span class="t-repo" id="c-repo"></span>

  <!-- A / B 选择：输入框可直接粘贴 sha/tag/分支；下拉从最近提交里挑 -->
  <div class="c-pickers">
    <div class="c-pick">
      <span class="c-pick-tag c-pick-a">A</span>
      <input class="c-sha mono" id="c-a" placeholder="sha / tag / 分支" spellcheck="false" autocomplete="off">
    </div>
    <button class="t-icon-btn c-swap" id="c-swap" title="交换 A 和 B">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2.5 5.5h11M10.5 2.5l3 3-3 3M13.5 10.5h-11M5.5 7.5l-3 3 3 3"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="c-pick">
      <span class="c-pick-tag c-pick-b">B</span>
      <input class="c-sha mono" id="c-b" placeholder="sha / tag / 分支" spellcheck="false" autocomplete="off">
    </div>
    <select class="c-recent" id="c-recent" title="从最近提交里选（填入最后点击的那个输入框）">
      <option value="">最近提交 …</option>
    </select>
  </div>

  <div class="spacer"></div>
  <span class="t-stat" id="c-stat"></span>
  <a class="t-btn c-back" id="c-back" title="回到文件树">文件树</a>
</header>

<main class="t-layout" id="c-layout">
  <!-- 左：只包含有变更的文件 -->
  <section class="t-tree-pane">
    <div class="t-tree-head">
      <input class="t-filter" id="c-filter" placeholder="过滤变更文件…" spellcheck="false">
      <button class="t-icon-btn" id="c-collapse" title="全部折叠">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 6 6)"/>
        </svg>
      </button>
    </div>
    <!-- 状态筛选：只列出现的状态，带数量 -->
    <div class="c-filters" id="c-filters" hidden></div>
    <div class="t-tree-wrap">
      <div class="t-tree" id="c-tree" role="tree"></div>
      <div class="t-empty" id="c-empty" hidden></div>
    </div>
  </section>

  <div class="t-splitter" id="c-splitter" role="separator" aria-label="调整树宽度" title="拖动调整宽度，双击复位"></div>

  <!-- 右：选中文件的 diff -->
  <section class="t-file-pane">
    <div class="t-file-head">
      <span class="t-file-path" id="c-file-path"></span>
      <span class="c-file-status" id="c-file-status"></span>
      <div class="spacer"></div>
      <span class="t-file-meta" id="c-file-meta"></span>
    </div>
    <div class="t-file-body" id="c-file-body">
      <div class="t-empty" style="padding:24px 16px">在左侧选择一个变更文件，查看两个提交之间的差异。</div>
    </div>
  </section>
</main>

<div class="h-toast" id="c-toast" hidden></div>

<script type="module" src="/compare.js"></script>
</body>
</html>
