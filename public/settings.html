<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · Worktree</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/settings.css">
</head>
<body class="settings-body">
<header class="topbar">
  <div class="brand">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="4" cy="3" r="1.6" fill="currentColor"/><circle cx="4" cy="13" r="1.6" fill="currentColor"/>
      <circle cx="12" cy="6" r="1.6" fill="currentColor"/>
      <path d="M4 4.6v6.8M4 8.5c0-2 1.5-2.5 3-2.5h3.4" stroke="currentColor" stroke-width="1.3" fill="none"/>
    </svg>
    <span>设置</span>
  </div>
  <div class="spacer"></div>
  <span class="settings-platform" id="settings-platform"></span>
  <a class="btn sm" href="/">返回</a>
</header>

<main class="settings-main">
  <div class="settings-head">
    <h1>外部工具</h1>
    <p>配置「用 VS Code 打开 / 打开文件管理器 / 在终端中打开」实际调用的程序。命令只填可执行文件路径（参数写在「参数」里）；留空表示自动检测，检测不到时再手填绝对路径。</p>
  </div>

  <div id="settings-apps" class="settings-apps"></div>

  <div class="settings-actions">
    <button class="btn" id="settings-reload">重新载入</button>
    <button class="btn primary" id="settings-save">保存</button>
  </div>
  <div class="settings-msg" id="settings-msg" hidden></div>
</main>

<script type="module" src="/settings.js"></script>
</body>
</html>
